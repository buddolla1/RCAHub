spring.application.name=RCAHub
server.port=${SERVER_PORT:8086}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/RCADB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:RCA}
spring.datasource.password=${DB_PASSWORD:RcaPassword}
spring.datasource.hikari.pool-name=RcaHubPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


logging.level.com.syf.rcahub=${RCAHUB_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level logger=%logger{36} message=%msg%n


